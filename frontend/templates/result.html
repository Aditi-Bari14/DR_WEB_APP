<!DOCTYPE html>
<html>
<head>
  <title>Prediction Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<div class="navbar">
  <div class="nav-left">
      <!-- BACK BUTTON -->
        <button onclick="goBack()" class="back-btn">←</button>
            <span class="logo">DR</span>
            <span class="project-name">Diabetic Retinopathy</span>
        </div>
  <div class="menu-toggle" id="menuToggle">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="nav-right" id="navMenu">
    <a href="/dashboard">Dashboard</a>
    <a href="/history">History</a>
    <a href="/predict-dr">New Prediction</a>
    <a href="/login">Logout</a>
  </div>
</div>


<div class="container">  
  <h2 >Prediction Result</h2>
<div class="xai-box">
  <div class="summary-content">

     <div class="summary-item">
            <span class="label">DR Detected Stage:</span>
            <span class="value">
                <span class="status-badge {{ prediction.prediction|lower|replace(' ', '-') }}">
        {{ prediction.prediction }}
      </span>
            </span>
        </div>

    <div class="summary-item">
      <span class="label">Findings:</span>
      <span class="value">
        <span>
             {{ prediction.lesion_report.lesions | join(', ') }}
        </span>
      </span>
    </div>

    <div class="summary-item">
            <span class="label">Model Confidence:</span>
            <span class="value">{{confidence}}%</span>
        </div>
</div>

    <div class="action-buttons">
      <a href="/predict-dr" class="btn-primary">Predict Another</a>
      <a href="/patient/{{ patient_id }}" class="btn-primary">View Patient History</a>
      <a href="/explain/{{ patient_id }}" class="btn-primary">Explain Prediction</a>
    </div>
</div>
  </div>
</div>

<script>
    // Mobile menu toggle
    const menuToggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');

    menuToggle.addEventListener('click', function() {
        menuToggle.classList.toggle('active');
        navMenu.classList.toggle('active');
    });

    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
        if (!menuToggle.contains(event.target) && !navMenu.contains(event.target)) {
            menuToggle.classList.remove('active');
            navMenu.classList.remove('active');
        }
    });

    // Close menu when clicking a link
    navMenu.addEventListener('click', function(event) {
        if (event.target.tagName === 'A') {
            menuToggle.classList.remove('active');
            navMenu.classList.remove('active');
        }
    });
     function goBack() {
    window.history.back();
}
</script>

</body>
</html>
