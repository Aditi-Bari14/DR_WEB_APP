<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <button onclick="goBack()" class="back-btn">←</button>
        <span class="logo">DR</span>
        <span class="project-name">Diabetic Retinopathy</span>
    </div>
    <div class="menu-toggle" id="menuToggle">
        <span></span><span></span><span></span>
    </div>
    <div class="nav-right" id="navMenu">
        <a href="/">Home</a>
        <a href="/login">Login</a>
    </div>
</div>

<div class="container">
    <h2>Register</h2>
    <p class="subtitle">Create a new account</p>

    <!-- MESSAGE BOX -->
    <div id="msgBox" class="msg-box" style="display:none;"></div>

    <div class="form-box small-form">
        <form id="registerForm">
            <label>Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit" id="registerBtn">Register</button>
        </form>

        <p style="text-align:center; margin-top:16px; font-size:14px;">
            Already have an account? <a href="/login" style="color:#0b5ed7; font-weight:600;">Login</a>
        </p>
    </div>
</div>

<style>
.msg-box {
    max-width: 420px;
    margin: 0 auto 16px auto;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    animation: fadeIn 0.3s ease;
}
.msg-success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
}
.msg-error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

<script>
function showMsg(message, type) {
    const box = document.getElementById('msgBox');
    box.textContent = message;
    box.className = 'msg-box ' + (type === 'success' ? 'msg-success' : 'msg-error');
    box.style.display = 'block';
    if (type === 'success') {
        setTimeout(() => { box.style.display = 'none'; }, 3000);
    }
}

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const btn = document.getElementById('registerBtn');
    btn.textContent = 'Registering...';
    btn.disabled = true;

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch("{{ backend_url }}/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
            showMsg('✅ Registered successfully! Redirecting to login...', 'success');
            setTimeout(() => { window.location.href = "/login"; }, 1500);
        } else {
            showMsg('❌ ' + (data.error || 'Registration failed'), 'error');
            btn.textContent = 'Register';
            btn.disabled = false;
        }
    } catch (err) {
        showMsg('❌ Connection error. Please try again.', 'error');
        btn.textContent = 'Register';
        btn.disabled = false;
    }
});

const menuToggle = document.getElementById('menuToggle');
const navMenu = document.getElementById('navMenu');
menuToggle.addEventListener('click', function() {
    menuToggle.classList.toggle('active');
    navMenu.classList.toggle('active');
});
document.addEventListener('click', function(event) {
    if (!menuToggle.contains(event.target) && !navMenu.contains(event.target)) {
        menuToggle.classList.remove('active');
        navMenu.classList.remove('active');
    }
});
function goBack() { window.history.back(); }
</script>
</body>
</html>
